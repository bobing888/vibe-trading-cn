[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-trading-cn"
version = "0.1.0"
description = "BTC/ETH 多 Agent AI 交易平台（基于 HKUDS/Vibe-Trading 二次开发）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # 上游基座
    "vibe-trading-ai>=0.1.16",
    # 多 Agent 决策（TradingAgents 集成）
    "langgraph>=0.2",
    "langchain>=0.3",
    # MCP 工具链
    "mcp>=1.0",
    # 数据获取（BTC/ETH）
    "ccxt>=4.0",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.7",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]